<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root (or the designated system user) may own the service -->
  <policy user="root">
    <allow own="org.prelogin.Status1"/>
  </policy>

  <!-- Any process on the system bus may call methods and receive signals -->
  <policy context="default">
    <allow send_destination="org.prelogin.Status1"/>
    <allow receive_sender="org.prelogin.Status1"/>
  </policy>

</busconfig>
